name: Project Sirens CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest Integration Suite
      run: |
        # Tests use isolated MockRedis and mock configurations
        pytest tests/ --cov=src --cov=hub --cov-report=xml

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Staging Deployment
      run: |
        echo "Simulating Staging Deployment for Edge Hardware..."
        # In a real environment, this would execute an SSH command or Ansible playbook
        # to push the docker-compose image down to the Raspberry Pi Fleet or Cloud Hub.
        # Example: ssh user@staging.local 'cd /app && git pull && docker compose up -d'
